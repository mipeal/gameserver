---
# Deploy the Rust gameserver stack to one Debian/Ubuntu host.
#
#   cp ansible/inventory.example.ini ansible/inventory.ini   # edit the host
#   ansible-playbook -i ansible/inventory.ini ansible/site.yml -e @~/.ctf-gameserver-secrets.yml
#
# The playbook installs Docker Engine + the compose plugin, syncs this
# repository, installs your config + env file, and converges
# rust/docker-compose.rust.yml. Re-running it is safe: package installation,
# git sync, templating and `docker compose up` are all convergent. See
# ansible/README.md for the inputs and the deploy/verify/rollback workflow.
- name: Deploy the CTF gameserver (Rust stack)
  hosts: gameservers
  become: true
  gather_facts: true

  vars:
    # --- source ---
    gameserver_repo_url: "https://github.com/example/gameserver.git"  # override
    gameserver_repo_version: master
    gameserver_repo_dest: /opt/gameserver

    # --- required inputs ---
    gameserver_config_src: ""        # local path to your config.yaml (see config.sample.yaml)
    gameserver_secret_flag_key: ""   # 64 hex chars: openssl rand -hex 32

    # --- database ---
    # false: use an external PostgreSQL (gameserver_postgres_server).
    # true:  run the bundled postgres service (compose profile "donotstart").
    gameserver_postgres_local: false
    gameserver_postgres_server: ""   # external host; ignored when local
    gameserver_postgres_port: 5432
    gameserver_postgres_db: ctf
    gameserver_postgres_user: ctf
    gameserver_postgres_password: ""

    # --- redis (the compose stack always starts this service) ---
    gameserver_redis_host: redis
    gameserver_redis_port: 6379
    gameserver_redis_db: 0
    gameserver_redis_password: ""

    # --- images and the optional metrics sidecar ---
    gameserver_image_registry: localhost  # images are <registry>/gameserver-rust and <registry>/gameserver/submitter
    gameserver_build_images: true         # false when the images are pulled from a registry
    gameserver_telegraf_enabled: false    # needs a TimescaleDB; otherwise it crash-loops
    gameserver_timescale_server: ""
    gameserver_timescale_db: ""
    gameserver_timescale_user: ""
    gameserver_timescale_password: ""

    # --- URLs printed at the end ---
    gameserver_public_host: "{{ ansible_host | default(inventory_hostname) }}"

    _deb_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64', 'armv7l': 'armhf'}.get(ansible_architecture, ansible_architecture) }}"

    gameserver_env_dest: "{{ gameserver_repo_dest }}/rust/.env"
    _compose_base:
      - docker
      - compose
      - -f
      - "{{ gameserver_repo_dest }}/rust/docker-compose.rust.yml"
      - --env-file
      - "{{ gameserver_env_dest }}"
    _compose_profile: "{{ ['--profile', 'donotstart'] if gameserver_postgres_local | bool else [] }}"
    _compose_scale: "{{ [] if gameserver_telegraf_enabled | bool else ['--scale', 'submitter_telegraf=0'] }}"

  pre_tasks:
    - name: Check that the config source exists on the control node
      ansible.builtin.stat:
        path: "{{ gameserver_config_src }}"
      delegate_to: localhost
      become: false
      register: gameserver_config_stat
      when: gameserver_config_src | length > 0

    - name: Validate the required inputs
      ansible.builtin.assert:
        that:
          - ansible_distribution in ['Debian', 'Ubuntu']
          - gameserver_repo_url != 'https://github.com/example/gameserver.git'
          - gameserver_config_stat.stat.isreg | default(false)
          - gameserver_secret_flag_key is match('^[0-9a-fA-F]{64}$')
          - gameserver_postgres_local | bool or gameserver_postgres_server | length > 0
          - gameserver_postgres_password | length > 0
        fail_msg: >-
          Missing or invalid input. Required: a supported distro (Debian/Ubuntu),
          gameserver_repo_url (not the placeholder), gameserver_config_src (an
          existing local path to your config.yaml), gameserver_secret_flag_key
          (64 hex chars), gameserver_postgres_password, and either
          gameserver_postgres_local=true or gameserver_postgres_server.
          See ansible/README.md.

  tasks:
    - name: Install prerequisite packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - git
        state: present
        update_cache: true

    - name: Create the apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker's apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"
        force: false

    - name: Add the Docker apt repository
      ansible.builtin.copy:
        dest: /etc/apt/sources.list.d/docker.list
        content: "deb [arch={{ _deb_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable\n"
        mode: "0644"

    - name: Install Docker Engine and the compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure the Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Sync the gameserver repository
      ansible.builtin.git:
        repo: "{{ gameserver_repo_url }}"
        dest: "{{ gameserver_repo_dest }}"
        version: "{{ gameserver_repo_version }}"
        update: true
        # the checkout is owned by the playbook: config/env are written below,
        # so local modifications must not block a version switch
        force: true

    - name: Install the gameserver config file
      ansible.builtin.copy:
        src: "{{ gameserver_config_src }}"
        dest: "{{ gameserver_repo_dest }}/rust/config.yaml"
        mode: "0640"
      no_log: true

    - name: Write the compose environment file
      ansible.builtin.template:
        src: env.j2
        dest: "{{ gameserver_env_dest }}"
        mode: "0600"
      no_log: true

    - name: Build the stack images locally
      ansible.builtin.command:
        argv: "{{ _compose_base + ['build'] }}"
        chdir: "{{ gameserver_repo_dest }}/rust"
      when: gameserver_build_images | bool
      changed_when: true

    - name: Pull the stack images from the registry
      ansible.builtin.command:
        argv: "{{ _compose_base + ['pull'] }}"
        chdir: "{{ gameserver_repo_dest }}/rust"
      when: not gameserver_build_images | bool
      changed_when: true

    - name: Deploy the stack
      ansible.builtin.command:
        argv: "{{ _compose_base + _compose_profile + ['up', '-d', '--wait', '--remove-orphans'] + _compose_scale }}"
        chdir: "{{ gameserver_repo_dest }}/rust"
      register: gameserver_compose_up
      changed_when: >-
        'Started' in gameserver_compose_up.stdout
        or 'Created' in gameserver_compose_up.stdout
        or 'Recreated' in gameserver_compose_up.stdout

    - name: Wait for the controlserver API
      ansible.builtin.uri:
        url: "http://127.0.0.1:5000/overview/logs"
        status_code: 200
      register: gameserver_health
      until: gameserver_health.status | default(0) == 200
      retries: 36
      delay: 5

    - name: Wait for the scoreboard
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/"
        status_code: 200
      register: gameserver_scoreboard
      until: gameserver_scoreboard.status | default(0) == 200
      retries: 36
      delay: 5

    - name: Show the service URLs
      ansible.builtin.debug:
        msg:
          - "Admin GUI / admin API: http://{{ gameserver_public_host }}:5000  (unauthenticated — firewall it)"
          - "Scoreboard:            http://{{ gameserver_public_host }}:8080"
          - "Flag submitter:        {{ gameserver_public_host }}:1337  (raw TCP)"
