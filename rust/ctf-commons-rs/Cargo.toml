[package]
name = "ctf-commons-rs"
version = "0.1.0"
edition = "2024"
publish = false
description = "Rust port of `saarctf_commons/` (config, network math, metrics, redis, retry) — ADR-014"

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres"] }
redis = { version = "0.32", features = ["connection-manager", "tokio-comp"] }
tokio = { version = "1", default-features = false, features = ["time"] }

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }
