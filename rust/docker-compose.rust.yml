name: gameserver

# Rust stack — same services, same volumes and ports as docker-compose.yml.
# Differences: controlserver/timer/migrate collapse into one `controlserver`
# binary (it runs sqlx migrations + the master timer + the API), the celery
# `checker` becomes `checker_runner` over Redis Streams (no RabbitMQ needed),
# and the scoreboard daemon runs the native `scoreboard` binary.

volumes:
  postgres:
  redis:
  public-scoreboard:
  internal-scoreboard:

x-gameserver-common-env: &gameserver-common-env
  POSTGRES_SERVER: ${POSTGRES_SERVER}
  POSTGRES_PORT: ${POSTGRES_PORT}
  POSTGRES_DATABASE: ${POSTGRES_DB}
  POSTGRES_USERNAME: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  REDIS_HOST: ${REDIS_HOST}
  REDIS_PORT: ${REDIS_PORT}
  REDIS_DB: ${REDIS_DB}
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  SECRET_FLAG_KEY: ${SECRET_FLAG_KEY}
  CONFIG_FILE: ${CONFIG_FILE}
  CONFIG: ${CONFIG_FILE}  # rust binaries read CONFIG
  CTF_CONFIG: ${CONFIG_FILE}  # python checker subprocesses (saarctf_commons)
  SCOREBOARD_PATH: ${PUBLIC_SCOREBOARD_PATH}
  SCOREBOARD_PATH_INTERNAL: ${INTERNAL_SCOREBOARD_PATH}
  CTF_PYTHON_DIR: /opt

x-rust-image: &rust-image
  image: "${IMAGE_REGISTRY}/gameserver-rust"
  build:
    context: ..
    dockerfile: rust/controlserver-rs/Dockerfile.rust

networks:
  default:
    driver_opts:
      com.docker.network.driver.mtu: 1290

services:
  postgres:
    image: postgres:17.2
    environment:
      - POSTGRES_DB
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    volumes:
      - postgres:/var/lib/postgresql/data
    restart: unless-stopped
    profiles:
      - donotstart
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 1s
      retries: 30

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis:/data
    restart: "unless-stopped"
    ports:
      - "127.0.0.1:6379:6379"

  submitter:
    image: "${IMAGE_REGISTRY}/gameserver/submitter"
    build: ../flag-submission-server
    environment:
      POSTGRES_SERVER: ${POSTGRES_SERVER}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DATABASE: ${POSTGRES_DB}
      POSTGRES_USERNAME: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_DATABASE: ${REDIS_DB}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CONFIG_SECRET_FLAGS: ${SECRET_FLAG_KEY}
    volumes:
      - ./config.yaml:/config.yaml:ro
    ports:
      - 1337:31337
    ulimits:
      nofile: 16384
    restart: "unless-stopped"
    depends_on:
      controlserver:
        condition: service_started
      redis:
        condition: service_started
        restart: true

  submitter_telegraf:
    image: "telegraf"
    volumes:
      - "./telegraf.submitter.conf:/etc/telegraf/telegraf.conf:ro"
    environment:
      PG_SERVER: ${TIMESCALE_SERVER}
      PG_USERNAME: ${TIMESCALE_USER}
      PG_PASSWORD: ${TIMESCALE_PASSWORD}
      PG_DATABASE_METRICS: ${TIMESCALE_DB}
    network_mode: "service:submitter"

  # controlserver + master timer + sqlx migrations in one binary
  controlserver:
    <<: *rust-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./config.yaml:${CONFIG_FILE}:ro
      - public-scoreboard:${PUBLIC_SCOREBOARD_PATH}
      - internal-scoreboard:${INTERNAL_SCOREBOARD_PATH}
    ports:
      - 5000:5000
    command: ["/usr/local/bin/controlserver"]
    restart: "unless-stopped"
    depends_on:
      redis:
        condition: service_started

  checker:
    <<: *rust-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./config.yaml:${CONFIG_FILE}:ro
    command: ["/usr/local/bin/checker_runner"]
    deploy:
      replicas: 8
    ulimits:
      nofile: 65536
      nproc: 65536
    stop_grace_period: 1m
    restart: "unless-stopped"
    depends_on:
      controlserver:
        condition: service_started
      redis:
        condition: service_started

  # off-site scoreboard generation daemon (writes the JSON files)
  scoreboard-daemon:
    <<: *rust-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./config.yaml:${CONFIG_FILE}:ro
      - public-scoreboard:${PUBLIC_SCOREBOARD_PATH}
      - internal-scoreboard:${INTERNAL_SCOREBOARD_PATH}
    command: ["/usr/local/bin/scoreboard"]
    restart: "unless-stopped"
    depends_on:
      controlserver:
        condition: service_started

  scoreboard:
    image: nginx
    volumes:
      - ./nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - internal-scoreboard:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: "unless-stopped"
