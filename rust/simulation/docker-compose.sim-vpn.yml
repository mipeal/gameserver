  sim-init:
    image: gameserver-sim
    restart: "no"
    environment:
      TEAMS: "8"
    volumes:
      - wg-keystore:/run/sim/wg
      - keys:/run/sim/keys
      - ./wg:/opt/sim/wg:ro
    command:
      - sh
      - -c
      - wireguard-sync generate -a $((TEAMS + 1)) && python3 /opt/sim/wg/split-keystore.py
    networks: [simnet]

  controlserver:
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    volumes:
      - keys:/run/sim/keys:ro
      - ./wg:/opt/sim/wg:ro
    command:
      - sh
      - -c
      - /opt/sim/wg/server-setup.sh; exec /usr/local/bin/controlserver
    ports:
      - "51820/udp"

  vpnboard:
    image: gameserver-sim
    environment:
      CONFIG: /opt/sim/config.sim.yaml
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: saarctf
      POSTGRES_USERNAME: saarctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SCOREBOARD_PATH: /var/scoreboard
      VPNBOARD_PATH: /tmp/vpnboard
    volumes:
      - ./config.sim.yaml:/opt/sim/config.sim.yaml:ro
    command: ["/usr/local/bin/vpn_status_daemon"]
    network_mode: "service:controlserver"
    restart: unless-stopped
    depends_on:
      controlserver:
        condition: service_started

volumes:
