[package]
name = "scoreboard-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-net = "0.6"
gloo-timers = { version = "0.3", features = ["futures"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Storage", "IntersectionObserver", "IntersectionObserverEntry", "IntersectionObserverInit", "MediaQueryList", "AudioContext", "GainNode", "OscillatorNode", "AudioParam", "AudioDestinationNode", "AudioNode", "AudioScheduledSourceNode", "SpeechSynthesis", "SpeechSynthesisUtterance", "OscillatorType"] }
