<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="CTF scoreboard">
	<base href="/">
	<title>Scoreboard</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<script data-trunk type="module" src="js/chart.umd.js"></script>
	<!-- the live platform's compiled styles.less (bootstrap theme + fontawesome) -->
	<link rel="stylesheet" href="css/scoreboard.css?v=8">
	<link rel="stylesheet" href="css/components.css?v=8">
	<!-- dark Japandi theme layer (must stay last) -->
	<link rel="stylesheet" href="css/japandi.css?v=8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
	<link data-trunk rel="copy-dir" href="css" />
	<!-- Lenis smooth scroll (CDN); skipped when the user prefers reduced motion -->
	<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"
		integrity="sha384-O55L/6rhHr9CFvrxqv5luxOCcmVaBmETbZbJDP+Do8T0pztTACsFBD/IXCNkj7DV"
		crossorigin="anonymous"></script>
	<script>
		(function () {
			var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			if (reduced || typeof Lenis === 'undefined') return;
			var lenis = new Lenis({ duration: 1.1 });
			function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
			requestAnimationFrame(raf);
		})();
	</script>
</head>
<body></body>
</html>
