<!doctype html>
<html lang="en" class="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="CTF scoreboard">
	<meta name="color-scheme" content="dark light">
	<base href="/">
	<title>CTF Scoreboard</title>
	<link rel="icon" type="image/png" href="favicon.png">
	<script data-trunk type="module" src="js/chart.umd.js"></script>
	<!-- the live platform's compiled styles.less (bootstrap theme + fontawesome) -->
	<link rel="stylesheet" href="css/scoreboard.css?v=13">
	<link rel="stylesheet" href="css/components.css?v=13">
	<!-- Ops Console theme layer (must stay last) -->
	<link rel="stylesheet" href="css/ops.css?v=13">
	<link data-trunk rel="copy-dir" href="css" />
	<!-- Lenis smooth scroll (CDN); skipped when the user prefers reduced motion -->
	<script src="https://unpkg.com/lenis@1.1.14/dist/lenis.min.js"
		integrity="sha384-O55L/6rhHr9CFvrxqv5luxOCcmVaBmETbZbJDP+Do8T0pztTACsFBD/IXCNkj7DV"
		crossorigin="anonymous"></script>
	<script>
		(function () {
			var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
			if (reduced || typeof Lenis === 'undefined') return;
			var lenis = new Lenis({ duration: 1.1 });
			function raf(time) { lenis.raf(time); requestAnimationFrame(raf); }
			requestAnimationFrame(raf);
		})();
	</script>
</head>
<body></body>
</html>
