name: saarctf-sim

# Simulation deployment (SAARCTF_SIMULATION=1): the full Rust stack against
# per-team vulnbox fixture containers on the 10.32.0.0/16 simnet. Never used
# by the real pipeline. See rust/simulation/README.md.
#
# Used together with (generated by rust/simulation/gen_compose.py):
#   -f simulation/docker-compose.vulnboxes.yml   (always)
#   -f simulation/docker-compose.sim-vpn.yml     (SIM_VPN=1)
# `simctl up` assembles all of this.

x-gameserver-common-env: &gameserver-common-env
  POSTGRES_SERVER: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DATABASE: saarctf
  POSTGRES_USERNAME: saarctf
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  SECRET_FLAG_KEY: ${SECRET_FLAG_KEY}
  CONFIG: /opt/sim/config.sim.yaml
  SAARCTF_CONFIG: /opt/sim/config.sim.yaml  # python checker subprocesses (saarctf_commons)
  SCOREBOARD_PATH: /var/scoreboard
  SAARCTF_PYTHON_DIR: /opt
  SAARCTF_SIMULATION: "1"
  SAARCTF_SIM_SEED: /opt/sim/seed.sql

x-sim-image: &sim-image
  image: gameserver-sim
  build:
    context: .
    dockerfile: simulation/Dockerfile.sim
    args:
      BASE_IMAGE: ${BASE_IMAGE:-gameserver-rust}

volumes:
  postgres:
  redis:
  scoreboard:

networks:
  simnet: {}

services:
  postgres:
    image: postgres:17.2
    environment:
      POSTGRES_DB: saarctf
      POSTGRES_USER: saarctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saarctf -d saarctf"]
      interval: 10s
      timeout: 1s
      retries: 30
    networks: [simnet]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis:/data
    restart: unless-stopped
    networks: [simnet]

  # controlserver + master timer + migrations + sim boot gate (seed/import/enable)
  controlserver:
    <<: *sim-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./simulation/config.sim.yaml:/opt/sim/config.sim.yaml:ro
      - ./simulation/seed.sql:/opt/sim/seed.sql:ro
      - ./simulation/services:/opt/services:ro
      - scoreboard:/var/scoreboard
    command: ["/usr/local/bin/controlserver"]
    ports:
      - "15000:5000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [simnet]

  checker_runner:
    <<: *sim-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./simulation/config.sim.yaml:/opt/sim/config.sim.yaml:ro
      - ./simulation/services:/opt/services:ro
    command: ["/usr/local/bin/checker_runner"]
    deploy:
      replicas: 4
    ulimits:
      nofile: 65536
      nproc: 65536
    stop_grace_period: 1m
    restart: unless-stopped
    depends_on:
      controlserver:
        condition: service_started
    networks: [simnet]

  submitter:
    image: gameserver/submitter
    build: ../flag-submission-server
    environment:
      POSTGRES_SERVER: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DATABASE: saarctf
      POSTGRES_USERNAME: saarctf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      CONFIG_SECRET_FLAGS: ${SECRET_FLAG_KEY}
      SAARCTF_CONFIG: /opt/sim/config.sim.yaml
    volumes:
      - ./simulation/config.sim.yaml:/opt/sim/config.sim.yaml:ro
    ports:
      - "1337:31337"
    ulimits:
      nofile: 16384
    restart: unless-stopped
    depends_on:
      controlserver:
        condition: service_started
    networks: [simnet]

  scoreboard-daemon:
    <<: *sim-image
    environment:
      <<: *gameserver-common-env
    volumes:
      - ./simulation/config.sim.yaml:/opt/sim/config.sim.yaml:ro
      - scoreboard:/var/scoreboard
    command: ["/usr/local/bin/scoreboard"]
    restart: unless-stopped
    depends_on:
      controlserver:
        condition: service_started
    networks: [simnet]

  scoreboard:
    image: nginx
    volumes:
      - ../nginx.default.conf:/etc/nginx/conf.d/default.conf:ro
      - scoreboard:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped
    networks: [simnet]

  # VPN add-ons (wg server setup, key generation, vpnboard) are merged in by
  # simulation/docker-compose.sim-vpn.yml when SIM_VPN=1.
