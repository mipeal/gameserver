<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CTF Management</title>
  <style>
    :root { color-scheme: light; }
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #1c2733; }
    nav { display: flex; gap: 4px; flex-wrap: wrap; background: #1c2733; padding: 8px 12px; }
    nav a { color: #cfd8e3; text-decoration: none; padding: 4px 10px; border-radius: 4px; font-size: 14px; }
    nav a:hover, nav a.active { background: #31435a; color: #fff; }
    main { padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
    h1 { font-size: 20px; margin: 8px 0 12px; }
    h2 { font-size: 16px; margin: 16px 0 8px; }
    table { border-collapse: collapse; width: 100%; background: #fff; font-size: 13px; }
    th, td { border: 1px solid #dde3ea; padding: 4px 8px; text-align: left; }
    th { background: #eef1f5; cursor: pointer; user-select: none; }
    .ok { color: #14742f; } .warn { color: #9a6700; } .err { color: #b02a37; }
    .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; background: #e2e8f0; margin-right: 4px; }
    button { padding: 4px 12px; border: 1px solid #b9c2cd; border-radius: 4px; background: #fff; cursor: pointer; }
    button:hover { background: #eef1f5; }
    input, select { padding: 4px 8px; border: 1px solid #b9c2cd; border-radius: 4px; }
    pre { background: #fff; border: 1px solid #dde3ea; padding: 8px; white-space: pre-wrap; font-size: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
    .card { background: #fff; border: 1px solid #dde3ea; border-radius: 6px; padding: 12px; }
    form.inline { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 6px 0; }
  </style>
</head>
<body></body>
</html>
