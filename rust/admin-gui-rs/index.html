<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CTF Ops Console</title>
  <style>
    :root {
      --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2d3644;
      --fg:#e6edf3; --dim:#8b949e; --ok:#3fb950; --warn:#d29922;
      --err:#f85149; --acc:#58a6ff; --mono:'SF Mono',ui-monospace,Menlo,monospace;
      color-scheme: dark;
    }
    * { box-sizing:border-box; margin:0; }
    body { background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system,sans-serif;
           display:flex; min-height:100vh; }

    /* ---- sidebar ---- */
    aside { width:190px; background:var(--panel); border-right:1px solid var(--line);
            padding:16px 0; flex-shrink:0; position:sticky; top:0; height:100vh;
            display:flex; flex-direction:column; overflow:auto; }
    aside .logo { font-family:var(--mono); font-weight:700; padding:0 18px 16px;
                  border-bottom:1px solid var(--line); letter-spacing:1px; }
    aside .logo span { color:var(--acc); }
    aside nav a { display:block; padding:8px 18px; color:var(--dim); text-decoration:none;
                  border-left:2px solid transparent; }
    aside nav a:hover { color:var(--fg); }
    aside nav a[aria-current="page"] { color:var(--fg); background:var(--panel2);
                                       border-left:2px solid var(--acc); }
    aside nav a[aria-current="page"]::before { content:"▸ "; }
    aside .auth { margin-top:auto; padding:12px 18px 2px; font-size:11px; color:var(--dim); }

    /* ---- page frame ---- */
    main { flex:1; min-width:0; padding:18px 22px; font-family:var(--mono); font-size:12.5px; }
    h1 { font-size:15px; letter-spacing:2px; text-transform:uppercase; }
    .sub { color:var(--dim); font-size:11.5px; margin:4px 0 14px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .topbar h1 { margin:0; }
    .clock { color:var(--acc); font-family:var(--mono); font-size:12px; }
    h2 { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1.5px;
         margin:18px 0 8px; }
    a { color:var(--acc); text-decoration:none; }
    a:hover { text-decoration:underline; }
    .ok { color:var(--ok); } .warn { color:var(--warn); } .err { color:var(--err); }
    .dim { color:var(--dim); }
    .u { font-size:13px; color:var(--dim); }
    .spark { color:var(--acc); letter-spacing:1px; }
    .hash { color:var(--dim); }
    .empty { color:var(--dim); font-size:11px; margin-top:8px; }

    /* ---- tiles ---- */
    .tiles { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px; }
    .facts { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-bottom:6px; }
    .tile { background:var(--panel); border:1px solid var(--line); border-radius:6px;
            padding:12px 14px; }
    .tile .k { color:var(--dim); font-size:10.5px; text-transform:uppercase; letter-spacing:1px; }
    .tile .v { font-size:20px; margin:4px 0 2px; }
    .tile .s { font-size:11px; color:var(--dim); }
    .facts .tile .v { font-size:16px; }

    /* ---- buttons / inputs ---- */
    button { background:var(--panel2); color:var(--fg); border:1px solid var(--line);
             border-radius:4px; padding:6px 12px; font:inherit; cursor:pointer; }
    button:hover { border-color:var(--acc); }
    button:disabled { opacity:.5; cursor:default; }
    button.primary { border-color:var(--acc); color:var(--acc); }
    button.danger { border-color:var(--err); color:var(--err); }
    button.warnbtn { border-color:var(--warn); color:var(--warn); }
    .btns { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
    .btns button { margin-right:0; }
    input, select { background:var(--bg); border:1px solid var(--line); color:var(--fg);
                    border-radius:4px; padding:5px 8px; font:inherit; }
    input[type="file"] { background:var(--panel2); padding:4px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    form.inline { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
    .toolbar { display:flex; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
    .toolbar label { color:var(--dim); font-size:11px; }
    .pager { margin:10px 0; color:var(--dim); display:flex; gap:8px; align-items:center; }
    .poll { color:var(--dim); font-size:11px; margin-top:8px; display:flex; gap:8px; align-items:center; }

    /* ---- tables ---- */
    table { width:100%; border-collapse:collapse; background:var(--panel);
            border:1px solid var(--line); border-radius:6px; overflow:hidden; }
    th { text-align:left; font-size:10.5px; color:var(--dim); text-transform:uppercase;
         padding:7px 10px; border-bottom:1px solid var(--line); font-weight:600; }
    th.sort { cursor:pointer; user-select:none; }
    th.sort:hover { color:var(--acc); }
    td { padding:6px 10px; border-bottom:1px solid #212936; vertical-align:top; }
    tr:last-child td { border-bottom:none; }
    tbody tr:hover td { background:rgba(255,255,255,.02); }
    .narrow { max-width:760px; }

    /* ---- pills / chips ---- */
    .pill { display:inline-block; padding:1px 7px; border-radius:3px; font-size:11px;
            border:1px solid var(--line); }
    .pill.ok { color:var(--ok); border-color:#1f4a2c; }
    .pill.warn { color:var(--warn); border-color:#5a4612; }
    .pill.err { color:var(--err); border-color:#622724; }
    .badge { display:inline-block; border:1px solid var(--line); border-radius:3px;
             padding:0 6px; font-size:11px; }

    /* ---- two-column layouts ---- */
    .cols { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .two { display:grid; grid-template-columns:1fr 1fr; gap:16px; }

    /* ---- charts (CSS bar charts) ---- */
    .chart { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:14px; }
    .chart .row { display:flex; align-items:center; gap:12px; margin:7px 0; font-size:12px;
                  flex-wrap:nowrap; }
    .chart .lab { width:130px; color:var(--dim); flex-shrink:0; }
    .chart .bars { flex:1; display:flex; align-items:flex-end; gap:3px; height:44px; min-width:0; }
    .chart .b { flex:1; background:linear-gradient(180deg,#58a6ff,#1f6feb);
                border-radius:1px 1px 0 0; opacity:.85; min-height:1px; }
    .chart .b.g { background:linear-gradient(180deg,#3fb950,#238636); }
    .chart .b.r { background:linear-gradient(180deg,#f85149,#da3633); }
    .chart .max { color:var(--dim); font-size:10.5px; width:64px; text-align:right;
                  flex-shrink:0; }

    /* ---- checker status team grid ---- */
    .grid { display:grid; grid-template-columns:repeat(8,1fr); gap:6px; margin-top:10px; }
    .cell { background:var(--panel); border:1px solid var(--line); border-radius:4px;
            padding:6px 8px; font-size:11px; }
    .cell b { display:block; color:var(--dim); font-weight:400; }

    /* ---- flags decode ---- */
    .decode { display:grid; grid-template-columns:170px 1fr; gap:4px 14px;
              background:var(--panel); border:1px solid var(--line); border-radius:6px;
              padding:14px 16px; max-width:760px; }
    .decode .k { color:var(--dim); }
    code { color:#c9d1d9; background:var(--panel2); border-radius:3px; padding:1px 6px;
           font-family:var(--mono); font-size:11.5px; }
    .flag-input { flex:1; max-width:560px; }

    /* ---- terminal output / logs ---- */
    pre { background:var(--panel); border:1px solid var(--line); border-radius:6px;
          padding:14px; font-size:12px; line-height:1.6; color:#c9d1d9; white-space:pre-wrap;
          overflow:auto; }
    .cin { color:var(--acc); } .cout { color:#c9d1d9; } .cerr { color:var(--err); }
    .logbox { background:var(--panel); border:1px solid var(--line); border-radius:6px;
              padding:12px 14px; font-size:11.5px; line-height:1.7; margin-top:8px;
              white-space:pre-wrap; word-break:break-word; }

    @media (max-width:1100px) {
      .cols, .two { grid-template-columns:1fr; }
      .tiles { grid-template-columns:repeat(2,1fr); }
      .facts { grid-template-columns:repeat(2,1fr); }
      .grid { grid-template-columns:repeat(4,1fr); }
    }
  </style>
</head>
<body></body>
</html>
