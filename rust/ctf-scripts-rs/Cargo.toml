[package]
name = "ctf-scripts-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
controlserver-rs = { path = "../controlserver-rs" }
ctf-commons-rs = { path = "../ctf-commons-rs" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "json", "macros"] }
redis = { version = "0.32", features = ["connection-manager", "tokio-comp"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "process", "io-util"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
md-5 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["chrono", "registry", "fmt", "env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
futures-util = "0.3"
libloading = "0.8"

[workspace]
